<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anmeldung wird abgeschlossen</title><link rel="stylesheet" href="styles.css"><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script></head>
<body><main class="shell"><section class="card"><h1>Anmeldung wird abgeschlossen …</h1><p id="status">Sitzung wird sicher an Outlook übergeben …</p></section></main><script>
(function(){
  const params = new URLSearchParams(location.hash.slice(1));
  const channel = sessionStorage.getItem('serviq_handoff_channel') || localStorage.getItem('serviq_handoff_channel');
  const handoffKey = sessionStorage.getItem('serviq_handoff_key') || localStorage.getItem('serviq_handoff_key');
  const payload = {access_token: params.get('access_token'), refresh_token: params.get('refresh_token'), expires_at: params.get('expires_at'), error: params.get('error_description') || params.get('error')};
  const message = JSON.stringify(payload);
  const status = document.getElementById('status');
  history.replaceState(null, '', location.pathname);

  const fromBase64Url=value=>Uint8Array.from(atob(value.replace(/-/g,'+').replace(/_/g,'/').padEnd(Math.ceil(value.length/4)*4,'=')),c=>c.charCodeAt(0));
  const toBase64Url=bytes=>btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  async function storeHandoff(){
    if(!/^[A-Za-z0-9_-]{40,64}$/.test(channel||'')||!/^[A-Za-z0-9_-]{40,64}$/.test(handoffKey||''))throw new Error('Ungültiger Anmeldecode.');
    const key=await crypto.subtle.importKey('raw',fromBase64Url(handoffKey),'AES-GCM',false,['encrypt']);
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const encrypted=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(message));
    const response=await fetch('https://rkhptbohniykwxhwhjiz.supabase.co/functions/v1/outlook-auth-handoff',{method:'POST',headers:{apikey:'sb_publishable_I3Pz0TnaVqRt6GdszYq_Jw_BETkoJAk','Content-Type':'application/json'},body:JSON.stringify({action:'put',channel,ciphertext:toBase64Url(new Uint8Array(encrypted)),iv:toBase64Url(iv)})});
    if(!response.ok)throw new Error('Die Sitzung konnte nicht sicher an Outlook übergeben werden.');
    sessionStorage.removeItem('serviq_handoff_channel');
    sessionStorage.removeItem('serviq_handoff_key');
    localStorage.removeItem('serviq_handoff_channel');
    localStorage.removeItem('serviq_handoff_key');
    status.textContent='Anmeldung erfolgreich. Sie können dieses Fenster schließen.';
  }

  function sendToOutlook(){
    try {
      if (!window.Office || !Office.context || !Office.context.ui) return false;
      try {
        Office.context.ui.messageParent(message, { targetOrigin: 'https://oguzhan66serviq.github.io' });
      } catch (_) {
        Office.context.ui.messageParent(message);
      }
      status.textContent = 'Anmeldung erfolgreich. Das Fenster wird geschlossen …';
      return true;
    } catch (_) { return false; }
  }

  if (payload.error || !payload.access_token) {
    status.textContent = payload.error || 'Microsoft hat keine gültige Anmeldung zurückgegeben.';
    return;
  }

  try {
    localStorage.setItem('serviq_oauth_bridge_v2', message);
    const channel = new BroadcastChannel('serviq_oauth_channel_v2');
    channel.postMessage(message);
    setTimeout(function(){ channel.close(); }, 1000);
  } catch (_) { /* Office Dialog API bleibt als primärer Weg aktiv. */ }

  storeHandoff().catch(error=>{status.textContent=error.message;});

  Office.onReady(sendToOutlook);
  Office.initialize = sendToOutlook;
  let attempts = 0;
  const retry = setInterval(function(){
    attempts += 1;
    sendToOutlook();
    if (attempts >= 40) clearInterval(retry);
    if (attempts >= 40) status.textContent = 'Die Anmeldung war erfolgreich. Bitte schließen Sie dieses Fenster und öffnen Sie das Add-in erneut.';
  }, 250);
})();
</script></body></html>
