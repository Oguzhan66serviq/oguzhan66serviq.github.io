<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Serviq-Anmeldung</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="shell"><section class="card"><h1>Anmeldung wird übernommen …</h1><p id="status">Microsoft-Anmeldung wird verschlüsselt an Serviq übergeben.</p></section></main><script>
(async function(){
  const status=document.getElementById('status');
  try{
    const params=new URLSearchParams(location.hash.slice(1));
    const query=new URLSearchParams(location.search);
    const channel=query.get('channel');
    const handoffKey=query.get('key');
    const payload={access_token:params.get('access_token'),refresh_token:params.get('refresh_token'),expires_at:params.get('expires_at'),error:params.get('error_description')||params.get('error')};
    history.replaceState(null,'',location.pathname);
    if(payload.error||!payload.access_token)throw new Error(payload.error||'Microsoft hat keine gültige Sitzung zurückgegeben.');
    if(!/^[A-Za-z0-9_-]{40,64}$/.test(channel||'')||!/^[A-Za-z0-9_-]{40,64}$/.test(handoffKey||''))throw new Error('Der sichere Einmal-Code fehlt.');
    const decode=value=>Uint8Array.from(atob(value.replace(/-/g,'+').replace(/_/g,'/').padEnd(Math.ceil(value.length/4)*4,'=')),c=>c.charCodeAt(0));
    const encode=bytes=>btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    const key=await crypto.subtle.importKey('raw',decode(handoffKey),'AES-GCM',false,['encrypt']);
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const encrypted=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(payload)));
    const response=await fetch('https://rkhptbohniykwxhwhjiz.supabase.co/functions/v1/outlook-auth-handoff',{method:'POST',headers:{apikey:'sb_publishable_I3Pz0TnaVqRt6GdszYq_Jw_BETkoJAk','Content-Type':'application/json'},body:JSON.stringify({action:'put',channel,ciphertext:encode(new Uint8Array(encrypted)),iv:encode(iv)})});
    if(!response.ok)throw new Error('Supabase konnte die Sitzung nicht übernehmen.');
    status.textContent='Erfolgreich angemeldet. Dieses Fenster kann geschlossen werden.';
    setTimeout(()=>window.close(),800);
  }catch(error){
    status.textContent=error.message||'Die Anmeldung konnte nicht abgeschlossen werden.';
  }
})();
</script></body></html>
